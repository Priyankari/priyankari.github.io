  <rect x="16" y="16" width="88" height="26" fill="#b1442b"/>
  <text x="26" y="34" fill="#ffffff" font-size="14" font-weight="700" letter-spacing="1">RO-MAN</text>
  <text x="18" y="350" fill="#5f574f" font-size="12" font-weight="700" letter-spacing="3">2025</text>
  <g><rect x="372" y="334" width="22" height="6" fill="#26221f"/><rect x="394" y="334" width="22" height="6" fill="#f4ece5" stroke="#26221f" stroke-width="1"/><rect x="416" y="334" width="22" height="6" fill="#26221f"/></g>
