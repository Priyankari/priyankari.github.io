  </g>

  <g stroke="#356b74" stroke-opacity="0.5" stroke-width="1.5" fill="none">
    <rect x="150" y="110" width="180" height="150"/><line x1="150" y1="160" x2="330" y2="160"/><line x1="150" y1="210" x2="330" y2="210"/>
    <line x1="210" y1="110" x2="210" y2="260"/><line x1="270" y1="110" x2="270" y2="260"/>
  </g>
  <g class="misreg" stroke="#b1442b" stroke-opacity="0.85" stroke-width="1.5" fill="none">
    <rect x="150" y="110" width="180" height="150"/><line x1="150" y1="160" x2="330" y2="160"/><line x1="150" y1="210" x2="330" y2="210"/>
